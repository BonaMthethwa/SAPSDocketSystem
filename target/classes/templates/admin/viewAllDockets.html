<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>View All Dockets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    
    <link rel="stylesheet" 
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 40px;
        }
        .table thead th {
            background-color: #343a40;
            color: white;
        }
        .container {
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>All Dockets</h2>

        <table class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th>Case Number</th>
                    <th>Complainant</th>
                    <th>Case Type</th>
                    <th>Status</th>
                    <th>Date Created</th>
                    <th>Created By</th>
                    <th>Edited By</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="docket : ${dockets}">
                    <td th:text="${docket.caseNumber}"></td>
                    <td th:text="${docket.complainantName}"></td>
                    <td th:text="${docket.caseTitle}"></td>
                    <td th:text="${docket.caseStatus}"></td>
                    <td><span th:text="${docket.dateCreated}"></span></td>
                    
                    <td th:text="${docket.createdBy != null ? docket.createdBy.name + ' ' + docket.createdBy.surname : 'System'}"></td>
                    <td th:text="${docket.createdBy != null ? docket.createdBy.name + ' ' + docket.createdBy.surname : 'N/A'}"></td>

                    <td>
                        <a th:href="@{/admin/trackDocket(id=${docket.id})}" class="btn btn-info btn-sm">Track</a>
                        
                       <a th:href="@{'/admin/deleteDocket'(id=${docket.id})}" 
                            class="btn btn-sm btn-danger" 
                             onclick="return confirm('Are you sure you want to permanently delete this docket?');">
                             Delete
                        </a>
                </tr>
            </tbody>
        </table>
    </div>

    <div>
    <button><a th:href="@{/admin/welcomeAdmin}" class="btn btn-primary">
                        <i class="fas fa-home"></i> Home
                    </a>
    </button>

</div>

    
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script 
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
