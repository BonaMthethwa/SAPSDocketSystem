<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    
    
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        integrity="sha384-rbsA2VBKQ2f1Qpzt4M9AB6j8s0mGFTtxwyg7E+/qY5nBzg+ybjUb+LfqV4C3CfJG" 
        crossorigin="anonymous">
    
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 500px;
            margin-top: 80px;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-bottom: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Reset Password</h2>

    <form th:action="@{/resetPassword}" method="post">
        <input type="hidden" name="email" th:value="${email}" />

        <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" name="newPassword" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirmPassword" class="form-control" required />
        </div>

        <button type="submit" class="btn btn-primary w-100">Reset Password</button>

        <div class="mt-3">
            <p th:if="${errorMessage}" class="text-danger" th:text="${errorMessage}"></p>
            <p th:if="${successMessage}" class="text-success" th:text="${successMessage}"></p>
        </div>
    </form>
</div>

</body>
</html>
