<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Docket</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Update Docket</h2>

    <form th:action="@{/updateDocket}" th:object="${docket}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>Case Number</label>
            <input type="text" th:field="*{caseNumber}" class="form-control" readonly />
        </div>

        <div class="form-group">
            <label>Complainant Name</label>
            <input type="text" th:field="*{complainantName}" class="form-control" readonly />
        </div>

        <div class="form-group">
            <label>Case Title</label>
            <input type="text" th:field="*{caseTitle}" class="form-control" readonly />
        </div>

        <div class="form-group">
            <label>Case Statement</label>
            <textarea th:field="*{caseStatement}" class="form-control" rows="3" readonly></textarea>
        </div>

        <div class="form-group">
            <label>Status</label>
            <input type="text" th:field="*{caseStatus}" class="form-control" readonly />
        </div>

        <div class="form-group">
            <label>Address</label>
            <input type="text" th:field="*{address}" class="form-control" readonly />
        </div>

        <div class="form-group">
            <label>Cellphone</label>
            <input type="text" th:field="*{cellphone}" class="form-control" readonly />
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="text" th:field="*{email}" class="form-control" readonly />
        </div>

       

        <div class="form-group">
            <label>Additional Information</label>
            <textarea th:field="*{additionalInfo}" class="form-control" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
</body>
</html>
